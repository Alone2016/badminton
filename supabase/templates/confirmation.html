<h2>Đăng nhập Cầu lông</h2>
<p>Bấm vào nút dưới đây để đăng nhập. Link dùng được 1 lần, có hiệu lực trong 1 giờ.</p>
<p>
  <a
    href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
    style="display:inline-block;padding:12px 20px;background:#059669;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600"
    >Đăng nhập</a
  >
</p>
<p style="color:#6b7280;font-size:13px">Nếu bạn không yêu cầu đăng nhập, hãy bỏ qua email này.</p>
